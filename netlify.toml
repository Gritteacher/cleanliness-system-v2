[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.23.2"
  YARN_VERSION = "1.22.22"
  YARN_FLAGS = "--network-timeout 600000 --non-interactive"

[functions."create-practice-pdf"]
  external_node_modules = ["@sparticuz/chromium"]
  included_files = ["netlify/assets/**", "node_modules/@sparticuz/chromium/bin/**"]

[functions."create-public-pdf"]
  included_files = ["netlify/assets/**"]

[functions."send-public-pdf-daily"]
  included_files = ["netlify/assets/**"]

[functions."send-public-pdf-background"]
  included_files = ["netlify/assets/**"]
